name: Smoke testy

on:
  push:
    branches: ['main', 'claude/**']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Nainštaluj Playwright + Chromium
        run: |
          npm ci --no-audit --no-fund > /dev/null
          npm i playwright --no-save > /dev/null
          npx playwright install --with-deps chromium
      - name: Spusti smoke testy
        run: node tests/smoke.mjs
      - name: Testy server-side brany (lib/brana.mjs)
        run: node tests/brana.mjs
      - name: Testy cookie relacie a loginu
        run: node tests/auth-cookie.mjs
      - name: Korpusove testy parsera anamnezy
        run: node tests/parser-korpus.mjs
      - name: Testy follow-up parsera
        run: node tests/parser-fu.mjs
      - name: Testy importu programu
        run: node tests/program-import.mjs
      - name: Testy extraktora poziadaviek
        run: node tests/poziadavky-import.mjs
      - name: Testy scrubbera osobnych udajov
        run: node tests/scrub.mjs
      - name: Testy diktovania EVK (korpus + okno diktatu)
        run: node tests/diktat-evk.mjs
      - name: Testy odvodenia pohlavia a veku z RC
        run: node tests/rc-auto.mjs
      - name: Testy staging algoritmov (TASC/GLASS/WIfI)
        run: node tests/staging.mjs
      - name: Testy materialoveho registra
        run: node tests/material-katalog.mjs
      - name: Testy WIfI logiky defektologie
        run: node tests/defektologia.mjs
      - name: Testy Rutherfordovej klasifikacie ALI
        run: node tests/ali.mjs
      - name: Testy VQI CLTI modelu prezitia
        run: node tests/vqi-clti.mjs
      - name: Testy skorovacich kalkulaciek (WELLS, CEAP)
        run: node tests/skorovacie.mjs
