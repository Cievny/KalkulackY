<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Měřicí list Zenith Alpha (PDF)</title>
<link rel="stylesheet" href="/tools/vendor/pdfjs/annotation_layer.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e5e9f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1a2745}
#bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #dde1ea;padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#bar b{flex:1;min-width:140px;font-size:14px}
#bar button{padding:8px 13px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid #dde1ea;background:#fff;color:#374151}
#bar button.pri{background:#1e40af;border-color:#1e40af;color:#fff}
#bar button:disabled{opacity:.5;cursor:default}
#msg{font-size:12.5px;font-weight:600;padding:6px 12px;min-height:28px}
#pages{padding:0 8px 24px}
.pg{position:relative;z-index:0;margin:0 auto 12px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.pg canvas{display:block;width:100%;height:100%}
.pg .annotationLayer{position:absolute;top:0;left:0;width:100%;height:100%}
@media print{#bar,#msg{display:none}body{background:#fff}#pages{padding:0}.pg{box-shadow:none;margin:0;page-break-after:always}}
</style>
</head>
<body>
<div id="bar">
  <b>📄 Měřicí list Zenith Alpha <span id="pac" style="font-weight:400;color:#6b7280"></span></b>
  <button type="button" class="pri" id="b_save" disabled>💾 Uložit k pacientovi</button>
  <button type="button" id="b_navrh" disabled>🧮 Doplnit návrh z tabulek</button>
  <button type="button" id="b_dl" disabled>⬇️ Stáhnout PDF</button>
  <button type="button" id="b_print" disabled>🖨️ Tisk</button>
  <button type="button" id="b_close">Zavřít</button>
</div>
<div id="msg"></div>
<div id="pages"></div>
<script type="module">
// Vyplniteľný originál hárku Cook AI-D53801. Stránka sama nič nenačíta ani neukladá:
// PDF dostane od rodičovskej stránky Požiadaviek (parent.zhPdf*) a vyplnené ho vráti jej.
import * as pdfjsLib from '/tools/vendor/pdfjs/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='/tools/vendor/pdfjs/pdf.worker.min.mjs';
const $=id=>document.getElementById(id);
const say=(t,c)=>{$('msg').textContent=t||'';$('msg').style.color=c||'#374151';};
const host=(window.parent!==window&&typeof window.parent.zhPdfLoad==='function')?window.parent:null;
let doc=null, dirty=false;
window.zhPdfDirty=()=>dirty;

const fields=name=>[...document.querySelectorAll('.annotationLayer [name="'+CSS.escape(name)+'"]')];
function getVal(name){const e=fields(name)[0];if(!e)return '';return e.type==='checkbox'?e.checked:e.value.trim();}
function setVal(name,v){
  fields(name).forEach(e=>{
    if(e.type==='checkbox'){if(e.checked!==!!v){e.checked=!!v;e.dispatchEvent(new Event('change',{bubbles:true}));}}
    else{e.value=v==null?'':String(v);e.dispatchEvent(new Event('input',{bubbles:true}));}
  });
}
function allVals(){
  const o={};
  document.querySelectorAll('.annotationLayer [name]').forEach(e=>{o[e.name]=e.type==='checkbox'?e.checked:e.value.trim();});
  return o;
}
// hárok počíta dĺžku cievy = L − cl dĺžka hlavného tela (v PDF to robí skript, tu my)
function calc(){
  [['L2','clLength1','Contralateral vessel length'],['L3','clLength','Ipsilateral vessel length']].forEach(([a,b,out])=>{
    const x=parseFloat(String(getVal(a)).replace(',','.')), y=parseFloat(String(getVal(b)).replace(',','.'));
    const v=(isNaN(x)||isNaN(y))?'':String(Math.round((x-y)*10)/10);
    if(getVal(out)!==v)setVal(out,v);
  });
}
const linkService={externalLinkEnabled:false,getDestinationHash:()=>'#',getAnchorUrl:()=>'#',addLinkAttributes(){},
  goToDestination(){},executeNamedAction(){},executeSetOCGState(){},setHash(){},isPageVisible:()=>true,isPageCached:()=>true};

async function render(){
  const box=$('pages');box.innerHTML='';
  for(let n=1;n<=doc.numPages;n++){
    const page=await doc.getPage(n);
    const base=page.getViewport({scale:1});
    const scale=Math.max(.6,Math.min(2,(document.documentElement.clientWidth-16)/base.width));
    const vp=page.getViewport({scale}), dpr=Math.min(window.devicePixelRatio||1,2);
    const wrap=document.createElement('div');wrap.className='pg';
    wrap.style.width=vp.width+'px';wrap.style.height=vp.height+'px';
    wrap.style.setProperty('--scale-factor',scale);
    const cv=document.createElement('canvas');cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);
    const layer=document.createElement('div');layer.className='annotationLayer';
    wrap.append(cv,layer);box.append(wrap);
    await page.render({canvasContext:cv.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null,
      annotationMode:pdfjsLib.AnnotationMode.ENABLE_FORMS}).promise;
    const annotations=await page.getAnnotations({intent:'display'});
    const al=new pdfjsLib.AnnotationLayer({div:layer,accessibilityManager:null,annotationCanvasMap:null,annotationEditorUIManager:null,
      page,viewport:vp.clone({dontFlip:true})});
    await al.render({annotations,imageResourcesPath:'',renderForms:true,linkService,downloadManager:null,
      annotationStorage:doc.annotationStorage,enableScripting:false,hasJSActions:false,fieldObjects:null});
  }
  box.addEventListener('input',()=>{dirty=true;calc();});
  box.addEventListener('change',()=>{dirty=true;});
}
async function bytes(){calc();return await doc.saveDocument();}

async function start(){
  if(!host){say('Tento list se otevírá z požadavku (Požadavky → Sizing → Zenith Alpha).','#b45309');return;}
  say('Načítám list…');
  try{
    const src=await host.zhPdfLoad();
    $('pac').textContent=src.pacient?'· '+src.pacient:'';
    doc=await pdfjsLib.getDocument({data:new Uint8Array(src.bytes)}).promise;
    await render();
    if(src.prefill)Object.entries(src.prefill).forEach(([k,v])=>{if(getVal(k)===''||getVal(k)===false)setVal(k,v);});
    calc();dirty=false;
    say(src.fresh?'Nový list – předvyplněny jsou údaje z požadavku. Po vyplnění dejte Uložit k pacientovi.':'Otevřen uložený list'+(src.datum?' z '+src.datum:'')+'.','#1d6f42');
    ['b_save','b_navrh','b_dl','b_print'].forEach(id=>$(id).disabled=false);
  }catch(e){say('❌ List se nepodařilo načíst: '+(e&&e.message||e),'#dc2626');}
}
$('b_save').onclick=async()=>{
  $('b_save').disabled=true;say('Ukládám…');
  try{
    const r=await host.zhPdfSave(await bytes(),allVals());
    if(r.ok)dirty=false;
    say(r.text,r.ok?'#1d6f42':'#dc2626');
  }catch(e){say('❌ Uložení selhalo: '+(e&&e.message||e),'#dc2626');}
  $('b_save').disabled=false;
};
$('b_navrh').onclick=()=>{
  const p=host.zhPdfNavrh(allVals());
  if(!p.vals){say('⚠️ '+p.text,'#b45309');return;}
  Object.entries(p.vals).forEach(([k,v])=>setVal(k,v));
  calc();dirty=true;say(p.text,'#1d6f42');
};
$('b_dl').onclick=async()=>{
  const u=URL.createObjectURL(new Blob([await bytes()],{type:'application/pdf'}));
  const a=document.createElement('a');a.href=u;a.download='zenith-alpha-harok.pdf';a.click();
  setTimeout(()=>URL.revokeObjectURL(u),5000);
};
$('b_print').onclick=()=>window.print();
$('b_close').onclick=()=>{
  if(dirty&&!confirm('List má neuložené změny. Zavřít bez uložení?'))return;
  if(host)host.zhPdfClose();
};
start();
</script>
</body>
</html>
