<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cievy zrozumiteľne — cievny.sk</title>
    <meta name="description" content="Všetko o cievnych ochoreniach na jednom mieste – od 14. októbra. Oddelenie intervenčnej angiológie NÚSCH.">
    <meta property="og:title" content="Cievy zrozumiteľne.">
    <meta property="og:description" content="Všetko o cievnych ochoreniach na jednom mieste – od 14. októbra.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.cievny.sk/">
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Farebná paleta podľa manuálu */
        :root {
            --color-wine: #6A1B42;
            --color-green: #2E8339;
            --color-green-dark: #256a2e;
            --color-beige: #F8F5F2;
            --color-powder-gray: #E0E0E0;
            --color-dark-gray: #333333;
            --color-mid-gray: #6f6a66;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--color-beige);
            color: var(--color-dark-gray);
            font-size: 16px;
            line-height: 1.6;
        }
        .page {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(20px, 4vw, 44px);
            position: relative;
            overflow: hidden;
        }

        /* veľký, jemný vodoznak loga v pozadí */
        .watermark {
            position: absolute;
            right: -8vw;
            top: 50%;
            transform: translateY(-50%) rotate(8deg);
            width: min(62vh, 60vw);
            opacity: 0.06;
            color: var(--color-wine);
            pointer-events: none;
        }
        .watermark svg { width: 100%; height: auto; display: block; }

        header {
            width: 100%;
            max-width: 960px;
            display: flex;
            align-items: center;
            z-index: 1;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .logo svg { color: var(--color-green); }
        .logo .word {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .logo .word .wine { color: var(--color-wine); }
        .logo .word .green { color: var(--color-green); }

        main {
            flex: 1;
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: clamp(18px, 3.2vh, 30px);
            padding: clamp(28px, 6vh, 64px) 0;
            z-index: 1;
        }
        .eyebrow {
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--color-green);
        }
        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 8vw, 4.8rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.025em;
            color: var(--color-wine);
            text-wrap: balance;
        }
        h1 .dot { color: var(--color-green); }
        .lede {
            margin: 0;
            font-size: clamp(1.05rem, 2.4vw, 1.3rem);
            color: var(--color-dark-gray);
            max-width: 34em;
        }
        .lede strong {
            font-weight: 700;
            color: var(--color-wine);
            white-space: nowrap;
            border-bottom: 3px solid var(--color-green);
            padding-bottom: 1px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            margin-top: 4px;
        }
        .btn-ig {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--color-green);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 13px 22px;
            border-radius: 0.5rem;
            transition: background-color 0.3s ease;
        }
        .btn-ig:hover { background-color: var(--color-green-dark); }
        .btn-ig:focus-visible { outline: 3px solid var(--color-wine); outline-offset: 3px; }
        .btn-ig svg { flex: none; }
        .actions .hint {
            color: var(--color-mid-gray);
            font-size: 0.92rem;
        }

        /* e-mail – zobrazí sa až po nastavení NEWSLETTER_ENDPOINT */
        .signup { width: 100%; max-width: 480px; margin-top: 2px; }
        .signup form { display: flex; gap: 8px; flex-wrap: wrap; }
        .signup input[type=email] {
            flex: 1 1 220px;
            background: #ffffff;
            border: 1px solid var(--color-powder-gray);
            border-radius: 0.5rem;
            color: var(--color-dark-gray);
            font: inherit;
            padding: 12px 16px;
        }
        .signup input[type=email]::placeholder { color: var(--color-mid-gray); }
        .signup input[type=email]:focus-visible { outline: 2px solid var(--color-green); outline-offset: 1px; border-color: var(--color-green); }
        .signup button {
            background: transparent;
            border: 1px solid var(--color-wine);
            border-radius: 0.5rem;
            color: var(--color-wine);
            font: inherit;
            font-weight: 600;
            padding: 12px 18px;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .signup button:hover { background: var(--color-wine); color: #ffffff; }
        .signup button:focus-visible { outline: 3px solid var(--color-green); outline-offset: 2px; }
        .signup .note { margin: 8px 0 0; font-size: 0.82rem; color: var(--color-mid-gray); }
        .signup .thanks { margin: 0; color: var(--color-green); font-weight: 600; }

        footer {
            width: 100%;
            max-width: 960px;
            z-index: 1;
        }
        .signature {
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-size: 0.74rem;
            color: var(--color-mid-gray);
        }
        .signature span { color: var(--color-wine); font-weight: 600; }
    </style>
</head>
<body>
<div class="page">

    <div class="watermark" aria-hidden="true">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M100 180 C140 140, 140 140, 100 100" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
            <path d="M100 100 C60 60, 60 60, 100 20" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
            <path d="M60 180 C80 140, 80 140, 100 100" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
            <path d="M140 180 C120 140, 120 140, 100 100" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
            <path d="M100 20 C80 50, 80 50, 60 60" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
            <path d="M100 20 C120 50, 120 50, 140 60" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
        </svg>
    </div>

    <header>
        <a href="/" class="logo">
            <svg width="28" height="28" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M100 180 C140 140, 140 140, 100 100" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
                <path d="M100 100 C60 60, 60 60, 100 20" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
                <path d="M60 180 C80 140, 80 140, 100 100" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
                <path d="M140 180 C120 140, 120 140, 100 100" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
                <path d="M100 20 C80 50, 80 50, 60 60" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
                <path d="M100 20 C120 50, 120 50, 140 60" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
            </svg>
            <span class="word"><span class="wine">cievny</span><span class="green">.sk</span></span>
        </a>
    </header>

    <main>
        <p class="eyebrow">Už čoskoro</p>
        <h1>Cievy zrozumiteľne<span class="dot">.</span></h1>
        <p class="lede">Všetko o cievnych ochoreniach na jednom mieste – <strong>od 14. októbra</strong>.</p>

        <div class="actions">
            <a class="btn-ig" href="https://www.instagram.com/cievny.sk/" target="_blank" rel="noopener">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/>
                    <circle cx="12" cy="12" r="4.5"/>
                    <circle cx="17.6" cy="6.4" r="1.3" fill="currentColor" stroke="none"/>
                </svg>
                Sledujte @cievny.sk
            </a>
            <span class="hint">Do spustenia zverejňujeme obsah na Instagrame.</span>
        </div>

        <div class="signup" id="signup" hidden>
            <form id="signup-form" novalidate>
                <input type="email" name="email" required autocomplete="email" placeholder="vas@email.sk" aria-label="Váš e-mail">
                <button type="submit">Dajte mi vedieť, keď spustíme</button>
            </form>
            <p class="note">Žiadny spam – pošleme jednu správu pri spustení stránky.</p>
        </div>
    </main>

    <footer>
        <p class="signature">Oddelenie intervenčnej angiológie · <span>NÚSCH</span></p>
    </footer>

</div>

<script>
    // Zber e-mailov: doplňte URL služby, ktorá formulár prijme (napr. Formspree
    // "https://formspree.io/f/XXXX" alebo FormSubmit "https://formsubmit.co/vas@email.sk").
    // Kým je hodnota prázdna, formulár sa nezobrazuje.
    var NEWSLETTER_ENDPOINT = "";

    (function(){
        var box = document.getElementById("signup");
        if (!NEWSLETTER_ENDPOINT) return;
        box.hidden = false;

        var form = document.getElementById("signup-form");
        form.addEventListener("submit", function(e){
            e.preventDefault();
            var email = form.email.value.trim();
            if (!email || email.indexOf("@") < 1) { form.email.focus(); return; }
            var btn = form.querySelector("button");
            btn.disabled = true;
            btn.textContent = "Odosielam…";
            fetch(NEWSLETTER_ENDPOINT, {
                method: "POST",
                headers: { "Accept": "application/json", "Content-Type": "application/json" },
                body: JSON.stringify({ email: email })
            }).then(function(r){
                if (!r.ok) throw new Error("send failed");
                box.innerHTML = '<p class="thanks">Ďakujeme! Ozveme sa vám pri spustení.</p>';
            }).catch(function(){
                btn.disabled = false;
                btn.textContent = "Dajte mi vedieť, keď spustíme";
                var note = box.querySelector(".note");
                if (note) note.textContent = "Nepodarilo sa odoslať – skúste to o chvíľu znova.";
            });
        });
    })();
</script>
</body>
</html>
