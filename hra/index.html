<head>

<style>
    html, body {
        margin: 0; padding: 0; overflow: hidden;
        width: 100%; height: 100%;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #87ceeb;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        display: flex; gap: 10px; flex-wrap: wrap;
        pointer-events: none;
    }
    .hud-box {
        background: rgba(0,0,0,0.55); color: #fff;
        padding: 8px 14px; border-radius: 10px;
        font-size: 16px; font-weight: 600;
        backdrop-filter: blur(4px);
    }
    #msg {
        position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
        z-index: 20; text-align: center; pointer-events: none;
        color: #fff; font-size: 28px; font-weight: 800;
        text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        opacity: 0; transition: opacity 0.4s;
    }
    #msg.show { opacity: 1; }
    #help {
        position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
        z-index: 10; pointer-events: none;
        background: rgba(0,0,0,0.45); color: #eee;
        padding: 6px 14px; border-radius: 10px; font-size: 13px;
        white-space: nowrap;
    }
    /* Mobilné ovládanie */
    #joystick {
        position: fixed; bottom: 30px; left: 30px; z-index: 15;
        width: 120px; height: 120px; border-radius: 50%;
        background: rgba(255,255,255,0.15);
        border: 2px solid rgba(255,255,255,0.4);
        display: none;
    }
    #stick {
        position: absolute; left: 35px; top: 35px;
        width: 50px; height: 50px; border-radius: 50%;
        background: rgba(255,255,255,0.55);
    }
    #jumpBtn {
        position: fixed; bottom: 45px; right: 35px; z-index: 15;
        width: 90px; height: 90px; border-radius: 50%;
        background: rgba(46,131,57,0.65);
        border: 2px solid rgba(255,255,255,0.5);
        color: #fff; font-size: 15px; font-weight: 700;
        display: none; align-items: center; justify-content: center;
    }
    @media (pointer: coarse) {
        #joystick { display: block; }
        #jumpBtn { display: flex; }
        #help { display: none; }
    }
</style>
</head>

<div id="hud">
    <div class="hud-box">🥚 <span id="coins">0</span>/<span id="coinsTotal">0</span></div>

<script type="module">
import * as THREE from 'three';

// ---------- Scéna ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaec9a0);
scene.fog = new THREE.Fog(0xaec9a0, 45, 130);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const sun = new THREE.DirectionalLight(0xfff3d6, 2.2);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.camera.far = 150;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xcfe0b8, 0.8));

// ---------- Pomocníci na stavbu sveta ----------
const platforms = [];   // statické aj pohyblivé kolízne bloky
const killBricks = [];  // láva – reset na checkpoint
const checkpoints = []; // zelené pady
const coins = [];       // mince
const movers = [];      // pohyblivé plošiny

function box(x, y, z, w, h, d, color, opts = {}) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshLambertMaterial({ color })
    );
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    const entry = { mesh, w, h, d, ...opts };
    if (opts.kill) killBricks.push(entry);
    else platforms.push(entry);
    return entry;
}

function movingBox(x, y, z, w, h, d, color, axis, range, speed, phase = 0) {
    const entry = box(x, y, z, w, h, d, color);
    entry.origin = new THREE.Vector3(x, y, z);
    entry.axis = axis; entry.range = range; entry.speed = speed; entry.phase = phase;
    entry.prevPos = entry.mesh.position.clone();
    entry.delta = new THREE.Vector3();
    movers.push(entry);
    return entry;
}

function checkpoint(x, y, z, w = 4, d = 4) {
    const entry = box(x, y, z, w, 0.4, d, 0x2ecc71);
    entry.checkpoint = new THREE.Vector3(x, y + 1.6, z);
    checkpoints.push(entry);
    return entry;
}

function coin(x, y, z) {
    // dino vajce
    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 16, 12),
        new THREE.MeshStandardMaterial({ color: 0xf3ecd8, roughness: 0.6 })
    );
    mesh.scale.set(1, 1.35, 1);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    scene.add(mesh);
    coins.push({ mesh, taken: false, baseY: y });
}

// ---------- Scenéria džungle ----------
function deco(geom, color, x, y, z) {
    const m = new THREE.Mesh(geom, new THREE.MeshLambertMaterial({ color }));
    m.position.set(x, y, z);
    m.castShadow = true;
    scene.add(m);
    return m;
}
function palm(x, y, z, h = 4) {
    deco(new THREE.BoxGeometry(0.5, h, 0.5), 0x6d4c33, x, y + h / 2, z);
    deco(new THREE.BoxGeometry(2.6, 0.5, 0.9), 0x2e6b2e, x, y + h + 0.2, z);
    deco(new THREE.BoxGeometry(0.9, 0.5, 2.6), 0x2e8339, x, y + h + 0.55, z);
    deco(new THREE.BoxGeometry(1.8, 0.5, 1.8), 0x3a9c46, x, y + h + 0.9, z);
}
function fern(x, y, z) {
    deco(new THREE.BoxGeometry(1.1, 0.5, 0.35), 0x3a9c46, x, y + 0.3, z);
    deco(new THREE.BoxGeometry(0.35, 0.5, 1.1), 0x2e8339, x, y + 0.55, z);
}
function island(x, y, z, w, d, withPalm = true) {
    // dekoračný ostrovček mimo dráhy (bez kolízií)
    deco(new THREE.BoxGeometry(w, 1, d), 0x5d6b4a, x, y, z);
    if (withPalm) palm(x, y + 0.5, z);
    fern(x + w / 4, y + 0.5, z + d / 4);
}

// Kockatý dinosaurus (raptor) – vráti skupinu s animovateľnými nohami
function makeRaptor(color = 0x5a7d3a) {
    const g = new THREE.Group();
    const mat = c => new THREE.MeshLambertMaterial({ color: c });
    const part = (w, h, d, x, y, z, c = color) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
        m.position.set(x, y, z); m.castShadow = true; g.add(m); return m;
    };
    part(0.9, 0.9, 1.8, 0, 1.1, 0);                 // telo
    part(0.55, 0.55, 1.1, 0, 1.7, 1.2);             // krk/hlava
    part(0.5, 0.35, 0.7, 0, 1.55, 1.85, 0x4a6830);  // papuľa
    const eyeMat = mat(0xffd700);
    const eL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), eyeMat);
    eL.position.set(-0.29, 1.8, 1.5); g.add(eL);
    const eR = eL.clone(); eR.position.x = 0.29; g.add(eR);
    part(0.5, 0.5, 1.6, 0, 1.15, -1.5);             // chvost
    part(0.3, 0.3, 1.0, 0, 1.2, -2.6);              // špička chvosta
    const legL = part(0.3, 0.9, 0.45, -0.35, 0.45, -0.3);
    const legR = part(0.3, 0.9, 0.45, 0.35, 0.45, -0.3);
    const armL = part(0.18, 0.5, 0.18, -0.5, 1.0, 0.6);
    const armR = part(0.18, 0.5, 0.18, 0.5, 1.0, 0.6);
    g.userData = { legL, legR, armL, armR };
    return g;
}

// Obrí dekoračný brachiosaurus v pozadí
function makeBrachio(x, y, z) {
    const g = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: 0x7a8f6b });
    const part = (w, h, d, px, py, pz) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(px, py, pz); g.add(m); return m;
    };
    part(4, 4, 8, 0, 5, 0);          // telo
    part(1.8, 8, 1.8, 0, 10, 3.5);   // krk
    part(1.6, 1.4, 2.6, 0, 14.4, 4.2); // hlava
    part(1.4, 4, 1.4, -1.2, 1.5, 2.5);
    part(1.4, 4, 1.4, 1.2, 1.5, 2.5);
    part(1.4, 4, 1.4, -1.2, 1.5, -2.5);
    part(1.4, 4, 1.4, 1.2, 1.5, -2.5);
    part(1.2, 1.2, 6, 0, 5.5, -6.5); // chvost
    g.position.set(x, y, z);
    scene.add(g);
    return g;
}

// ---------- Level (útek z Jurského parku) ----------
// Štart – vyhliadka v džungli
box(0, -0.5, 0, 12, 1, 12, 0x5d6b4a);
checkpoint(0, 0.2, 0, 5, 5);
palm(-4.5, 0, -4.5); palm(4.5, 0, 4);
fern(-4, 0, 3); fern(4.5, 0, -3.5);

// Prvé skoky po skalách
box(0, -0.5, -9, 3, 1, 3, 0x7d8471);
box(2.5, -0.5, -14, 3, 1, 3, 0x8a7f66);
box(-1, 0.2, -19, 3, 1, 3, 0x7d8471);
coin(2.5, 1, -14);

// Močiar s ostrovčekmi (zožerie ťa!)
box(0, -0.6, -30, 16, 0.6, 14, 0x36452a, { kill: true, reason: 'swamp' });
box(-4, 0.1, -26, 2.4, 0.8, 2.4, 0x7d8471);
box(0, 0.5, -30, 2.4, 0.8, 2.4, 0x7d8471);
box(4, 0.9, -34, 2.4, 0.8, 2.4, 0x7d8471);
coin(0, 1.8, -30);

// Checkpoint 2 – brod cez rieku
box(0, 0, -41, 8, 1, 6, 0x5d6b4a);
checkpoint(0, 0.7, -41);
fern(3, 0.5, -42.5);

// Plávajúce kmene nad roklinou
movingBox(0, 0.3, -49, 3, 0.6, 3, 0x6d4c33, 'x', 5, 1.2);
movingBox(0, 0.9, -55.5, 3, 0.6, 3, 0x6d4c33, 'x', 5, 1.5, Math.PI);
coin(0, 2.2, -55.5);

// Checkpoint 3 – raptorí výbeh + veža (výstup hore)
box(0, 0.5, -61, 9, 1, 7, 0x5d6b4a);
checkpoint(0, 1.2, -59);
box(3, 1.8, -66, 2.6, 0.6, 2.6, 0x8a7f66);
box(0, 3.1, -68.5, 2.6, 0.6, 2.6, 0x8a7f66);
box(-3, 4.4, -66, 2.6, 0.6, 2.6, 0x8a7f66);
box(0, 5.7, -63.5, 2.6, 0.6, 2.6, 0x8a7f66);
coin(0, 6.8, -63.5);

// Hliadkujúci raptor na plošine checkpointu 3
const raptor = makeRaptor();
raptor.position.set(0, 1.0, -62);
scene.add(raptor);
const raptorHit = { mesh: raptor, w: 1.2, h: 2.2, d: 3.0, kill: true, reason: 'dino' };
killBricks.push(raptorHit);

// Skalný výťah hore-dole (nastúp z vrcholu veže, keď je dole)
movingBox(0, 6.5, -69, 3, 0.6, 3, 0x7d8471, 'y', 2, 1.0);

// Finálna rovinka vo výške
box(0, 8, -75, 4, 0.6, 8, 0x5d6b4a);
box(0, 8, -83, 3, 0.6, 3, 0x6b8e23);
coin(0, 9.2, -83);

// Cieľ – brána Jurského parku
const goal = box(0, 8.2, -90, 8, 0.8, 6, 0x8a7f66);
palm(-3.2, 8.6, -91.5, 3); palm(3.2, 8.6, -91.5, 3);
const pillarL = deco(new THREE.BoxGeometry(1.1, 6, 1.1), 0x6d5c43, -2.6, 11.6, -90);
const pillarR = deco(new THREE.BoxGeometry(1.1, 6, 1.1), 0x6d5c43, 2.6, 11.6, -90);
deco(new THREE.BoxGeometry(0.9, 0.9, 0.9), 0xd4a017, -2.6, 14.9, -90); // fakle
deco(new THREE.BoxGeometry(0.9, 0.9, 0.9), 0xd4a017, 2.6, 14.9, -90);
const signTex = (() => {
    const c = document.createElement('canvas'); c.width = 512; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#4a3826'; g.fillRect(0, 0, 512, 128);
    g.strokeStyle = '#d4a017'; g.lineWidth = 8; g.strokeRect(8, 8, 496, 112);
    g.fillStyle = '#f3ecd8'; g.font = 'bold 56px Georgia, serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('JURSKÝ PARK', 256, 64);
    return new THREE.CanvasTexture(c);
})();
const sign = new THREE.Mesh(
    new THREE.BoxGeometry(6.4, 1.6, 0.5),
    new THREE.MeshLambertMaterial({ map: signTex })
);
sign.position.set(0, 14.2, -90);
sign.castShadow = true;
scene.add(sign);

// Scenéria okolo dráhy
makeBrachio(-22, -2, -35).rotation.y = 0.6;
makeBrachio(20, 4, -75).rotation.y = -2.4;
island(-10, -1, -14, 5, 5);
island(11, 0.5, -30, 6, 5);
island(-11, 0, -50, 5, 6);
island(10, 3, -60, 5, 5);
island(-9, 6.5, -80, 6, 5);

// ---------- Postavička (kockatý avatar) ----------
function limb(w, h, d, color, x, y, z) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
    m.position.set(x, y, z);
    m.castShadow = true;
    return m;
}
const player = new THREE.Group();
const body = limb(0.8, 1.0, 0.45, 0xc2a35d, 0, 1.0, 0);      // trup (khaki košeľa rangera)
const head = limb(0.6, 0.6, 0.6, 0xffd166, 0, 1.85, 0);      // hlava
// tvár
const faceTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = '#ffd166'; g.fillRect(0, 0, 64, 64);
    g.fillStyle = '#222';
    g.beginPath(); g.arc(20, 26, 5, 0, 7); g.fill();
    g.beginPath(); g.arc(44, 26, 5, 0, 7); g.fill();
    g.strokeStyle = '#222'; g.lineWidth = 3;
    g.beginPath(); g.arc(32, 38, 12, 0.2, Math.PI - 0.2); g.stroke();
    return new THREE.CanvasTexture(c);
})();
head.material = [
    head.material, head.material, head.material, head.material,
    new THREE.MeshLambertMaterial({ map: faceTex }), head.material
];
const armL = limb(0.25, 0.9, 0.25, 0xc2a35d, -0.55, 1.05, 0);
const armR = limb(0.25, 0.9, 0.25, 0xc2a35d, 0.55, 1.05, 0);
const legL = limb(0.3, 0.9, 0.3, 0x6d4c33, -0.2, 0.05, 0);
const legR = limb(0.3, 0.9, 0.3, 0x6d4c33, 0.2, 0.05, 0);
const hatBrim = limb(0.85, 0.1, 0.85, 0x8a6d3b, 0, 2.15, 0);  // rangerský klobúk
const hatTop = limb(0.5, 0.3, 0.5, 0x8a6d3b, 0, 2.32, 0);
player.add(body, head, armL, armR, legL, legR, hatBrim, hatTop);
scene.add(player);

// Fyzikálny stav hráča (AABB: šírka 0.8, výška ~2.2, stred v player.position)
const P = {
    pos: new THREE.Vector3(0, 1.0, 0),
    vel: new THREE.Vector3(),
    onGround: false,
    groundMover: null,
    spawn: new THREE.Vector3(0, 1.6, 0),
    halfW: 0.4, height: 2.35, feet: 0.4 // pos.y je stred nôh - feet offset
};

// ---------- Vstupy ----------
const keys = {};
addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyR') respawn();
    if (['Space','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);

// Kamera – orbit ťahaním
let camYaw = 0, camPitch = 0.35, camDist = 9;
let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', e => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
});
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
    if (!dragging) return;
    camYaw   -= (e.clientX - lastX) * 0.005;
    camPitch += (e.clientY - lastY) * 0.005;
    camPitch = Math.max(-0.1, Math.min(1.2, camPitch));
    lastX = e.clientX; lastY = e.clientY;
});
addEventListener('wheel', e => {
    camDist = Math.max(4, Math.min(18, camDist + e.deltaY * 0.01));
});

// Mobilný joystick
const joy = { x: 0, y: 0, active: false };
const joyEl = document.getElementById('joystick');
const stickEl = document.getElementById('stick');
joyEl.addEventListener('touchstart', handleJoy, { passive: false });
joyEl.addEventListener('touchmove', handleJoy, { passive: false });
joyEl.addEventListener('touchend', () => {
    joy.x = joy.y = 0; joy.active = false;
    stickEl.style.left = '35px'; stickEl.style.top = '35px';
});
function handleJoy(e) {
    e.preventDefault();
    const t = e.touches[0];
    const r = joyEl.getBoundingClientRect();
    let dx = t.clientX - (r.left + 60), dy = t.clientY - (r.top + 60);
    const len = Math.hypot(dx, dy);
    if (len > 45) { dx *= 45 / len; dy *= 45 / len; }
    joy.x = dx / 45; joy.y = dy / 45; joy.active = true;
    stickEl.style.left = (35 + dx) + 'px';
    stickEl.style.top = (35 + dy) + 'px';
}
let jumpTouch = false;
const jumpBtn = document.getElementById('jumpBtn');
jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); jumpTouch = true; }, { passive: false });
jumpBtn.addEventListener('touchend', () => jumpTouch = false);
// otáčanie kamery ťahaním po pravej strane obrazovky (mimo joysticku)
renderer.domElement.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (t.clientX > innerWidth / 2) { dragging = true; lastX = t.clientX; lastY = t.clientY; }
}, { passive: true });
renderer.domElement.addEventListener('touchmove', e => {
    if (!dragging) return;
    const t = e.touches[0];
    camYaw   -= (t.clientX - lastX) * 0.006;
    camPitch += (t.clientY - lastY) * 0.006;
    camPitch = Math.max(-0.1, Math.min(1.2, camPitch));
    lastX = t.clientX; lastY = t.clientY;
}, { passive: true });
renderer.domElement.addEventListener('touchend', () => dragging = false);

// ---------- HUD ----------
const $ = id => document.getElementById(id);
let coinCount = 0, deathCount = 0, startTime = performance.now(), finished = false;
$('coinsTotal').textContent = coins.length;
function showMsg(text, ms = 1800) {
    const m = $('msg');
    m.innerHTML = text;
    m.classList.add('show');
    if (ms) setTimeout(() => m.classList.remove('show'), ms);
}

function respawn() {
    P.pos.copy(P.spawn);
    P.vel.set(0, 0, 0);
}
const DEATH_MSG = {
    swamp: '🐊 Pohltil ťa močiar!',
    dino: '🦖 Raptor ťa dolapil!',
    fall: '💀 Spadol si do rokliny!',
};
function die(reason) {
    deathCount++;
    $('deaths').textContent = deathCount;
    showMsg(DEATH_MSG[reason] || '💀 Ups! Skús to znova.', 1200);
    respawn();
}

// ---------- Fyzika ----------
const GRAVITY = -28, MOVE_SPEED = 6.5, JUMP_SPEED = 10.5;

function collideAABB(entry, pos, margin = 0) {
    // vráti prienik hráča (AABB) s blokom, alebo null
    // margin > 0 rozšíri blok – na detekciu dotyku (checkpoint, cieľ),
    // ktorá musí fungovať aj po kolíznej korekcii (prienik je vtedy 0)
    const m = entry.mesh.position;
    const px = pos.x, py = pos.y + P.height / 2 - P.feet, pz = pos.z;
    const hw = P.halfW, hh = P.height / 2;
    const ox = (entry.w / 2 + hw + margin) - Math.abs(px - m.x);
    const oy = (entry.h / 2 + hh + margin) - Math.abs(py - m.y);
    const oz = (entry.d / 2 + hw + margin) - Math.abs(pz - m.z);
    if (ox > 0 && oy > 0 && oz > 0) return { ox, oy, oz, m };
    return null;
}

function physics(dt) {
    // pohyblivé plošiny
    const t = performance.now() / 1000;
    for (const mv of movers) {
        mv.prevPos.copy(mv.mesh.position);
        const offset = Math.sin(t * mv.speed + mv.phase) * mv.range;
        mv.mesh.position.copy(mv.origin);
        mv.mesh.position[mv.axis] += offset;
        mv.delta.subVectors(mv.mesh.position, mv.prevPos);
    }
    // ak hráč stojí na pohyblivej plošine, nesie ho so sebou
    if (P.onGround && P.groundMover) P.pos.add(P.groundMover.delta);

    // smer pohybu podľa kamery
    let ix = 0, iz = 0;
    if (keys['KeyW'] || keys['ArrowUp']) iz -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) iz += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
    if (joy.active) { ix = joy.x; iz = joy.y; }
    const len = Math.hypot(ix, iz);
    if (len > 1) { ix /= len; iz /= len; }

    const sin = Math.sin(camYaw), cos = Math.cos(camYaw);
    const moveX = (ix * cos - iz * sin) * MOVE_SPEED;
    const moveZ = (ix * sin + iz * cos) * MOVE_SPEED;
    P.vel.x = moveX;
    P.vel.z = moveZ;

    if ((keys['Space'] || jumpTouch) && P.onGround) {
        P.vel.y = JUMP_SPEED;
        P.onGround = false;
        P.groundMover = null;
    }
    P.vel.y += GRAVITY * dt;

    // posun + kolízie po osiach
    P.onGround = false;
    const prevMover = P.groundMover;
    P.groundMover = null;

    // Y
    P.pos.y += P.vel.y * dt;
    for (const pl of platforms) {
        const c = collideAABB(pl, P.pos);
        if (!c) continue;
        if (c.oy <= c.ox && c.oy <= c.oz) {
            const py = P.pos.y + P.height / 2 - P.feet;
            if (py > c.m.y) {
                P.pos.y += c.oy;
                if (P.vel.y < 0) { P.onGround = true; P.groundMover = movers.includes(pl) ? pl : null; }
                P.vel.y = Math.max(0, P.vel.y);
            } else {
                P.pos.y -= c.oy;
                P.vel.y = Math.min(0, P.vel.y);
            }
        }
    }
    // X
    P.pos.x += P.vel.x * dt;
    for (const pl of platforms) {
        const c = collideAABB(pl, P.pos);
        if (!c) continue;
        if (c.ox <= c.oy && c.ox <= c.oz) {
            P.pos.x += (P.pos.x > c.m.x ? c.ox : -c.ox);
        }
    }
    // Z
    P.pos.z += P.vel.z * dt;
    for (const pl of platforms) {
        const c = collideAABB(pl, P.pos);
        if (!c) continue;
        if (c.oz <= c.ox && c.oz <= c.oy) {
            P.pos.z += (P.pos.z > c.m.z ? c.oz : -c.oz);
        }
    }

    // močiar a dinosaury
    for (const kb of killBricks) {
        if (collideAABB(kb, P.pos)) { die(kb.reason); return; }
    }
    // pád do priepasti
    if (P.pos.y < -12) { die('fall'); return; }

    // checkpointy
    for (const cp of checkpoints) {
        if (collideAABB(cp, P.pos, 0.15) && !P.spawn.equals(cp.checkpoint)) {
            P.spawn.copy(cp.checkpoint);
            showMsg('✅ Checkpoint!', 1000);
        }
    }
    // mince
    for (const cn of coins) {
        if (cn.taken) continue;
        if (P.pos.distanceTo(cn.mesh.position) < 1.1) {
            cn.taken = true;
            cn.mesh.visible = false;
            coinCount++;
            $('coins').textContent = coinCount;
        }
    }
    // cieľ
    if (!finished && collideAABB(goal, P.pos, 0.15)) {
        finished = true;
        const secs = Math.floor((performance.now() - startTime) / 1000);
        showMsg(`🏆 UNIKOL SI Z PARKU!<br>Čas: ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')} • Vajcia: ${coinCount}/${coins.length}<br><small>Stlač R pre novú hru</small>`, 0);
    }
}

// ---------- Animácia postavičky ----------
let walkPhase = 0;
function animatePlayer(dt) {
    player.position.copy(P.pos);
    player.position.y -= P.feet + 0.05;

    const speed = Math.hypot(P.vel.x, P.vel.z);
    if (speed > 0.5) {
        player.rotation.y = Math.atan2(P.vel.x, P.vel.z);
        walkPhase += dt * speed * 1.8;
        const swing = Math.sin(walkPhase) * 0.7;
        armL.rotation.x = swing; armR.rotation.x = -swing;
        legL.rotation.x = -swing; legR.rotation.x = swing;
    } else {
        armL.rotation.x *= 0.8; armR.rotation.x *= 0.8;
        legL.rotation.x *= 0.8; legR.rotation.x *= 0.8;
    }
    if (!P.onGround) {
        armL.rotation.x = armR.rotation.x = -2.6; // ruky hore pri skoku
    }
}

// ---------- Slučka ----------
let lastT = performance.now();
function loop() {
    requestAnimationFrame(loop);
    const now = performance.now();
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;

    if (!finished) physics(dt);
    animatePlayer(dt);

    // vajcia sa vznášajú + raptor hliadkuje
    const t = now / 1000;
    for (const cn of coins) {
        if (cn.taken) continue;
        cn.mesh.rotation.y = t * 1.5;
        cn.mesh.position.y = cn.baseY + Math.sin(t * 2) * 0.15;
    }
    raptor.position.x = Math.sin(t * 0.9) * 3;
    raptor.rotation.y = Math.cos(t * 0.9) > 0 ? Math.PI / 2 : -Math.PI / 2;
    const rSwing = Math.sin(t * 9) * 0.5;
    raptor.userData.legL.rotation.x = rSwing;
    raptor.userData.legR.rotation.x = -rSwing;
    raptor.userData.armL.rotation.x = -rSwing * 0.5;
    raptor.userData.armR.rotation.x = rSwing * 0.5;

    // kamera
    const target = new THREE.Vector3().copy(P.pos).add(new THREE.Vector3(0, 1.6, 0));
    const camOff = new THREE.Vector3(
        Math.sin(camYaw) * Math.cos(camPitch),
        Math.sin(camPitch),
        Math.cos(camYaw) * Math.cos(camPitch)
    ).multiplyScalar(camDist);
    camera.position.copy(target).add(camOff);
    camera.lookAt(target);

    // slnko sleduje hráča (kvôli tieňom)
    sun.position.set(P.pos.x + 30, P.pos.y + 50, P.pos.z + 20);
    sun.target.position.copy(P.pos);
    sun.target.updateMatrixWorld();

    // časomiera
    if (!finished) {
        const secs = Math.floor((now - startTime) / 1000);
        $('timer').textContent = `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
    }

    renderer.render(scene, camera);
}

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

// R po výhre = úplný reštart
addEventListener('keydown', e => {
    if (e.code === 'KeyR' && finished) location.reload();
});

// diagnostika pre automatizované testy (bez vplyvu na hru)
window.__dbg = { P, coins, checkpoints, movers };

showMsg('🦖 Jurský Obby<br><small>Uteč cez džungľu k bráne parku!</small>', 2500);
respawn();
loop();
</script>
