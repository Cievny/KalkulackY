<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Jurský Obby – únik z parku</title>
<style>
    html, body {
        margin: 0; padding: 0; overflow: hidden;
        width: 100%; height: 100%;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #aec9a0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        display: flex; gap: 8px; flex-wrap: wrap;
        pointer-events: none; max-width: calc(100vw - 90px);
    }
    .hud-box {
        background: rgba(0,0,0,0.55); color: #fff;
        padding: 7px 12px; border-radius: 10px;
        font-size: 15px; font-weight: 600;
        backdrop-filter: blur(4px);
    }
    #xpbarWrap {
        display: inline-block; width: 64px; height: 8px;
        background: rgba(255,255,255,0.25); border-radius: 4px;
        margin-left: 6px; vertical-align: middle; overflow: hidden;
    }
    #xpbar { height: 100%; width: 0%; background: #ffd700; border-radius: 4px; }
    #msg {
        position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
        z-index: 20; text-align: center; pointer-events: none;
        color: #fff; font-size: 28px; font-weight: 800;
        text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        opacity: 0; transition: opacity 0.4s; width: 90vw;
    }
    #msg.show { opacity: 1; }
    #toasts {
        position: fixed; left: 12px; bottom: 60px; z-index: 18;
        pointer-events: none; display: flex; flex-direction: column-reverse; gap: 4px;
    }
    .toast {
        background: rgba(0,0,0,0.6); color: #ffd700;
        padding: 4px 10px; border-radius: 8px; font-size: 14px; font-weight: 600;
        opacity: 1; transition: opacity 0.6s;
    }
    #help {
        position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
        z-index: 10; pointer-events: none;
        background: rgba(0,0,0,0.45); color: #eee;
        padding: 6px 14px; border-radius: 10px; font-size: 13px;
        white-space: nowrap;
    }
    #shopBtn {
        position: fixed; top: 12px; right: 12px; z-index: 15;
        width: 46px; height: 46px; border-radius: 12px;
        background: rgba(0,0,0,0.55); color: #fff;
        font-size: 24px; display: flex; align-items: center; justify-content: center;
        cursor: pointer; border: 1px solid rgba(255,255,255,0.25);
    }
    #shop {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
        z-index: 30; width: min(400px, 92vw);
        background: rgba(18,28,16,0.94); color: #fff;
        border: 1px solid rgba(255,215,0,0.35);
        border-radius: 14px; padding: 18px 20px;
        backdrop-filter: blur(6px);
    }
    #shop h2 { margin: 0 0 6px; font-size: 20px; color: #ffd700; }
    #shopRes { font-size: 15px; margin-bottom: 12px; opacity: 0.9; }
    .shop-item {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,0.12);
    }
    .shop-item .info { font-size: 14px; }
    .shop-item .info small { opacity: 0.7; display: block; }
    .shop-item button {
        background: #2e8339; color: #fff; border: none;
        padding: 8px 12px; border-radius: 8px; font-weight: 700;
        font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .shop-item button:disabled { background: #555; opacity: 0.6; cursor: default; }
    #shopFoot { display: flex; justify-content: space-between; margin-top: 12px; }
    #shopFoot button {
        background: rgba(255,255,255,0.15); color: #fff; border: none;
        padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
    }
    /* Mobilné ovládanie */
    #joystick {
        position: fixed; bottom: 30px; left: 30px; z-index: 15;
        width: 120px; height: 120px; border-radius: 50%;
        background: rgba(255,255,255,0.15);
        border: 2px solid rgba(255,255,255,0.4);
        display: none;
    }
    #stick {
        position: absolute; left: 35px; top: 35px;
        width: 50px; height: 50px; border-radius: 50%;
        background: rgba(255,255,255,0.55);
    }
    #jumpBtn {
        position: fixed; bottom: 45px; right: 35px; z-index: 15;
        width: 90px; height: 90px; border-radius: 50%;
        background: rgba(46,131,57,0.65);
        border: 2px solid rgba(255,255,255,0.5);
        color: #fff; font-size: 15px; font-weight: 700;
        display: none; align-items: center; justify-content: center;
    }
    #stunBtn {
        position: fixed; bottom: 150px; right: 45px; z-index: 15;
        width: 64px; height: 64px; border-radius: 50%;
        background: rgba(90,60,160,0.65);
        border: 2px solid rgba(255,255,255,0.5);
        color: #fff; font-size: 26px;
        display: none; align-items: center; justify-content: center;
    }
    @media (pointer: coarse) {
        #joystick { display: block; }
        #jumpBtn { display: flex; }
        #stunBtn { display: flex; }
        #help { display: none; }
    }
</style>
</head>
<body>
<div id="hud">
    <div class="hud-box">🥚 <span id="coins">0</span>/<span id="coinsTotal">0</span></div>
    <div class="hud-box">🦖 <span id="deaths">0</span></div>
    <div class="hud-box">⏱️ <span id="timer">0:00</span></div>
    <div class="hud-box">🪵 <span id="wood">0</span></div>
    <div class="hud-box">🪨 <span id="stone">0</span></div>
    <div class="hud-box">⭐ LV <span id="lvl">1</span><span id="xpbarWrap"><span id="xpbar" style="display:block"></span></span></div>
    <div class="hud-box" id="stunHud" style="display:none">💤 –</div>
</div>
<div id="msg"></div>
<div id="toasts"></div>
<div id="help">WASD – pohyb • Medzerník – skok • Myš – kamera • U – dielňa • F – uspávač • R – checkpoint</div>
<div id="shopBtn" title="Dielňa (U)">🛠️</div>
<div id="shop" hidden>
    <h2>🛠️ Dielňa rangera</h2>
    <div id="shopRes"></div>
    <div id="shopItems"></div>
    <div id="shopFoot">
        <button id="resetSave">🗑️ Vynulovať postup</button>
        <button id="closeShop">Zavrieť (U)</button>
    </div>
</div>
<div id="joystick"><div id="stick"></div></div>
<div id="jumpBtn">SKOK</div>
<div id="stunBtn">💤</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);

// ---------- Uložený postup (XP, suroviny, nástroje) ----------
const SAVE_KEY = 'jurskyObby.save';
const save = { xp: 0, level: 1, wood: 0, stone: 0, boots: 0, speed: 0, stun: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

const TOOLS = {
    boots: { name: '🥾 Čižmy', desc: 'vyšší skok', max: 3, cost: l => ({ wood: 2 * l, stone: 2 * l - 1 }) },
    speed: { name: '👟 Tenisky', desc: 'rýchlejší beh', max: 3, cost: l => ({ wood: 2 * l, stone: 2 * l - 1 }) },
    stun:  { name: '💤 Uspávač', desc: 'uspí mäsožravca (F)', max: 3, cost: l => ({ wood: l + 2, stone: l + 1 }) },
};
const PERKS = {
    2: '🦘 Dvojskok odomknutý! Stlač skok aj vo vzduchu.',
    3: '🏃 +15 % rýchlosť behu!',
    4: '👑 Zlatý klobúk!',
    5: '🎖️ Elitný ranger – nový oblek!',
};
const STUN_CFG = [null, { dur: 4, cd: 10 }, { dur: 6, cd: 8 }, { dur: 8, cd: 6 }];

const moveSpeed = () => (6.5 + save.speed * 0.7) * (save.level >= 3 ? 1.15 : 1);
const jumpSpeed = () => 10.5 + save.boots * 0.8;
const maxJumps = () => (save.level >= 2 ? 2 : 1);

function toast(text) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    $('toasts').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; }, 1900);
    setTimeout(() => el.remove(), 2600);
}

function addXP(n, label) {
    save.xp += n;
    toast(`+${n} XP – ${label}`);
    while (save.xp >= save.level * 100) {
        save.xp -= save.level * 100;
        save.level++;
        showMsg(`⭐ LEVEL ${save.level}!<br><small>${PERKS[save.level] || 'Pokračuj v prieskume parku!'}</small>`, 2800);
        applyPerks();
    }
    persist();
}

// ---------- Scéna ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaec9a0);
scene.fog = new THREE.Fog(0xaec9a0, 45, 130);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const sun = new THREE.DirectionalLight(0xfff3d6, 2.2);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.camera.far = 150;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xcfe0b8, 0.8));

// ---------- Pomocníci na stavbu sveta ----------
const platforms = [];   // statické aj pohyblivé kolízne bloky
const killBricks = [];  // smrteľné zóny – reset na checkpoint
const checkpoints = []; // zelené pady
const coins = [];       // dino vajcia
const movers = [];      // pohyblivé plošiny
const pickups = [];     // suroviny (drevo, kameň)
const dinos = [];       // dinosaury s vlastným správaním

function box(x, y, z, w, h, d, color, opts = {}) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshLambertMaterial({ color })
    );
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    const entry = { mesh, w, h, d, ...opts };
    if (opts.kill) killBricks.push(entry);
    else platforms.push(entry);
    return entry;
}

function movingBox(x, y, z, w, h, d, color, axis, range, speed, phase = 0) {
    const entry = box(x, y, z, w, h, d, color);
    entry.origin = new THREE.Vector3(x, y, z);
    entry.axis = axis; entry.range = range; entry.speed = speed; entry.phase = phase;
    entry.prevPos = entry.mesh.position.clone();
    entry.delta = new THREE.Vector3();
    movers.push(entry);
    return entry;
}

function checkpoint(x, y, z, w = 4, d = 4) {
    const entry = box(x, y, z, w, 0.4, d, 0x2ecc71);
    entry.checkpoint = new THREE.Vector3(x, y + 1.6, z);
    checkpoints.push(entry);
    return entry;
}

function coin(x, y, z) {
    // dino vajce
    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.35, 16, 12),
        new THREE.MeshStandardMaterial({ color: 0xf3ecd8, roughness: 0.6 })
    );
    mesh.scale.set(1, 1.35, 1);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    scene.add(mesh);
    coins.push({ mesh, taken: false, baseY: y });
}

function pickup(type, x, y, z) {
    let mesh;
    if (type === 'wood') {
        mesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.55, 0.32, 0.32),
            new THREE.MeshLambertMaterial({ color: 0x8a5a2b })
        );
    } else {
        mesh = new THREE.Mesh(
            new THREE.IcosahedronGeometry(0.3, 0),
            new THREE.MeshLambertMaterial({ color: 0x9a9a9a })
        );
    }
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    scene.add(mesh);
    pickups.push({ mesh, type, taken: false, baseY: y });
}

// ---------- Scenéria džungle ----------
function deco(geom, color, x, y, z) {
    const m = new THREE.Mesh(geom, new THREE.MeshLambertMaterial({ color }));
    m.position.set(x, y, z);
    m.castShadow = true;
    scene.add(m);
    return m;
}
function palm(x, y, z, h = 4) {
    deco(new THREE.BoxGeometry(0.5, h, 0.5), 0x6d4c33, x, y + h / 2, z);
    deco(new THREE.BoxGeometry(2.6, 0.5, 0.9), 0x2e6b2e, x, y + h + 0.2, z);
    deco(new THREE.BoxGeometry(0.9, 0.5, 2.6), 0x2e8339, x, y + h + 0.55, z);
    deco(new THREE.BoxGeometry(1.8, 0.5, 1.8), 0x3a9c46, x, y + h + 0.9, z);
}
function fern(x, y, z) {
    deco(new THREE.BoxGeometry(1.1, 0.5, 0.35), 0x3a9c46, x, y + 0.3, z);
    deco(new THREE.BoxGeometry(0.35, 0.5, 1.1), 0x2e8339, x, y + 0.55, z);
}
function island(x, y, z, w, d, withPalm = true) {
    deco(new THREE.BoxGeometry(w, 1, d), 0x5d6b4a, x, y, z);
    if (withPalm) palm(x, y + 0.5, z);
    fern(x + w / 4, y + 0.5, z + d / 4);
}

// Skalná veža stúpajúca z hlbín priepasti (len dekorácia, bez kolízií)
function rockSpire(x, z, top, s = 1) {
    deco(new THREE.BoxGeometry(3.4 * s, 12, 3.4 * s), 0x6e685c, x, top - 7, z);
    deco(new THREE.BoxGeometry(2.3 * s, 4, 2.3 * s), 0x7a7466, x + 0.3 * s, top - 1.6, z - 0.2 * s);
    deco(new THREE.BoxGeometry(1.5 * s, 1.6, 1.5 * s), 0x8a8474, x - 0.2 * s, top + 0.3, z + 0.3 * s);
    deco(new THREE.BoxGeometry(1.6 * s, 0.4, 1.6 * s), 0x4f5d3a, x - 0.2 * s, top + 1.2, z + 0.3 * s); // machový vrch
}

function makeZzz() {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    g.font = '44px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('💤', 32, 34);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
    sprite.scale.set(1.4, 1.4, 1);
    sprite.position.set(0, 3, 0);
    sprite.visible = false;
    return sprite;
}

// Kockatý raptor (mäsožravec)
function makeRaptor(color = 0x5a7d3a) {
    const g = new THREE.Group();
    const mat = c => new THREE.MeshLambertMaterial({ color: c });
    const part = (w, h, d, x, y, z, c = color) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
        m.position.set(x, y, z); m.castShadow = true; g.add(m); return m;
    };
    part(0.9, 0.9, 1.8, 0, 1.1, 0);                 // telo
    part(0.55, 0.55, 1.1, 0, 1.7, 1.2);             // krk/hlava
    part(0.5, 0.35, 0.7, 0, 1.55, 1.85, 0x4a6830);  // papuľa
    const eyeMat = mat(0xffd700);
    const eL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), eyeMat);
    eL.position.set(-0.29, 1.8, 1.5); g.add(eL);
    const eR = eL.clone(); eR.position.x = 0.29; g.add(eR);
    part(0.5, 0.5, 1.6, 0, 1.15, -1.5);             // chvost
    part(0.3, 0.3, 1.0, 0, 1.2, -2.6);              // špička chvosta
    const legL = part(0.3, 0.9, 0.45, -0.35, 0.45, -0.3);
    const legR = part(0.3, 0.9, 0.45, 0.35, 0.45, -0.3);
    const armL = part(0.18, 0.5, 0.18, -0.5, 1.0, 0.6);
    const armR = part(0.18, 0.5, 0.18, 0.5, 1.0, 0.6);
    g.userData = { legL, legR, armL, armR };
    return g;
}

// Mäsožravec: hliadkuje, a keď si blízko, naháňa ťa v rámci svojho územia
function addCarnivore(x, y, z, bounds, axis, range, speed, aggro = 6.5) {
    const group = makeRaptor();
    group.position.set(x, y, z);
    scene.add(group);
    const zzz = makeZzz();
    group.add(zzz);
    const hit = { mesh: group, w: 1.2, h: 2.2, d: 3.0, kill: true, reason: 'dino', sleeping: false };
    killBricks.push(hit);
    const dino = {
        type: 'carnivore', group, hit, zzz, baseY: y, bounds, axis, range,
        speed, aggro, phase: 0, origin: { x, z }, sleepUntil: 0, walk: 0,
    };
    hit.dino = dino;
    dinos.push(dino);
    return group;
}

// Bylinožravý triceratops – neškodný, dá sa mu vyliezť na chrbát a povozí ťa
function makeTrike(color = 0x9aa77c) {
    const g = new THREE.Group();
    const mat = c => new THREE.MeshLambertMaterial({ color: c });
    const part = (w, h, d, x, y, z, c = color) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
        m.position.set(x, y, z); m.castShadow = true; g.add(m); return m;
    };
    part(1.8, 1.4, 2.8, 0, 1.7, -0.2);              // telo
    part(1.0, 0.9, 0.8, 0, 1.6, 1.6);               // hlava
    part(1.7, 1.5, 0.25, 0, 2.0, 1.15);             // golier
    part(0.12, 0.12, 0.6, -0.3, 1.9, 2.1, 0xf3ecd8); // rohy
    part(0.12, 0.12, 0.6, 0.3, 1.9, 2.1, 0xf3ecd8);
    part(0.12, 0.35, 0.12, 0, 1.35, 2.0, 0xf3ecd8);  // nosový roh
    part(0.45, 0.4, 0.3, 0, 1.25, 2.05, 0x7c8a63);   // zobák
    part(0.5, 1.0, 0.5, -0.6, 0.5, 0.8);
    part(0.5, 1.0, 0.5, 0.6, 0.5, 0.8);
    part(0.5, 1.0, 0.5, -0.6, 0.5, -1.1);
    part(0.5, 1.0, 0.5, 0.6, 0.5, -1.1);
    part(0.6, 0.6, 1.2, 0, 1.6, -1.9);              // chvost
    return g;
}

// Obrí dekoračný brachiosaurus v pozadí
function makeBrachio(x, y, z) {
    const g = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: 0x7a8f6b });
    const part = (w, h, d, px, py, pz) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(px, py, pz); g.add(m); return m;
    };
    part(4, 4, 8, 0, 5, 0);
    part(1.8, 8, 1.8, 0, 10, 3.5);
    part(1.6, 1.4, 2.6, 0, 14.4, 4.2);
    part(1.4, 4, 1.4, -1.2, 1.5, 2.5);
    part(1.4, 4, 1.4, 1.2, 1.5, 2.5);
    part(1.4, 4, 1.4, -1.2, 1.5, -2.5);
    part(1.4, 4, 1.4, 1.2, 1.5, -2.5);
    part(1.2, 1.2, 6, 0, 5.5, -6.5);
    g.position.set(x, y, z);
    scene.add(g);
    return g;
}

// ---------- Level (útek z Jurského parku) ----------
// Štart – vyhliadka v džungli
box(0, -0.5, 0, 12, 1, 12, 0x5d6b4a);
checkpoint(0, 0.2, 0, 5, 5);
palm(-4.5, 0, -4.5); palm(4.5, 0, 4);
fern(-4, 0, 3); fern(4.5, 0, -3.5);
pickup('wood', 3, 0.7, -3.5);
pickup('stone', -3, 0.7, 2.5);

// Prvé skoky po skalách
box(0, -0.5, -9, 3, 1, 3, 0x7d8471);
box(2.5, -0.5, -14, 3, 1, 3, 0x8a7f66);
box(-1, 0.2, -19, 3, 1, 3, 0x7d8471);
coin(2.5, 1, -14);
pickup('wood', -1, 1.1, -19);

// Močiar s ostrovčekmi (zožerie ťa!)
box(0, -0.6, -30, 16, 0.6, 14, 0x36452a, { kill: true, reason: 'swamp' });
box(-4, 0.1, -26, 2.4, 0.8, 2.4, 0x7d8471);
box(0, 0.5, -30, 2.4, 0.8, 2.4, 0x7d8471);
box(4, 0.9, -34, 3.0, 0.8, 3.0, 0x7d8471);
checkpoint(4, 1.5, -34, 2.2, 2.2); // po 5 prekážkach (3 skaly + 2 ostrovčeky)
coin(0, 1.8, -30);
pickup('stone', -4, 1.0, -26);
pickup('wood', 4, 1.8, -34);

// Checkpoint 2 – výbeh triceratopsa
box(0, 0, -41, 8, 1, 6, 0x5d6b4a);
checkpoint(0, 0.7, -42.5);
fern(3.2, 0.5, -43);

// Triceratops: neviditeľný pohyblivý blok nesie kolízie, model ho sleduje
const trikeBox = movingBox(0, 1.45, -39.5, 2.0, 1.9, 3.0, 0x000000, 'x', 2.5, 0.5);
trikeBox.mesh.visible = false;
const trikeGroup = makeTrike();
scene.add(trikeGroup);
let trikePetted = false;

// Bonusová rímsa – dostaneš sa na ňu z chrbta triceratopsa

// Mobilný joystick
const joy = { x: 0, y: 0, active: false };
const joyEl = $('joystick');
const stickEl = $('stick');
joyEl.addEventListener('touchstart', handleJoy, { passive: false });
joyEl.addEventListener('touchmove', handleJoy, { passive: false });
joyEl.addEventListener('touchend', () => {
    joy.x = joy.y = 0; joy.active = false;
    stickEl.style.left = '35px'; stickEl.style.top = '35px';
});
function handleJoy(e) {
    e.preventDefault();
    const t = e.touches[0];
    const r = joyEl.getBoundingClientRect();
    let dx = t.clientX - (r.left + 60), dy = t.clientY - (r.top + 60);
    const len = Math.hypot(dx, dy);
    if (len > 45) { dx *= 45 / len; dy *= 45 / len; }
    joy.x = dx / 45; joy.y = dy / 45; joy.active = true;
    stickEl.style.left = (35 + dx) + 'px';
    stickEl.style.top = (35 + dy) + 'px';
}

// ---------- Fyzika ----------
const GRAVITY = -28;

function collideAABB(entry, pos, margin = 0) {
    // vráti prienik hráča (AABB) s blokom, alebo null
    // margin > 0 rozšíri blok – na detekciu dotyku (checkpoint, cieľ),
    // ktorá musí fungovať aj po kolíznej korekcii (prienik je vtedy 0)
    const m = entry.mesh.position;
    const px = pos.x, py = pos.y + P.height / 2 - P.feet, pz = pos.z;
    const hw = P.halfW, hh = P.height / 2;
    const ox = (entry.w / 2 + hw + margin) - Math.abs(px - m.x);
    const oy = (entry.h / 2 + hh + margin) - Math.abs(py - m.y);
    const oz = (entry.d / 2 + hw + margin) - Math.abs(pz - m.z);
    if (ox > 0 && oy > 0 && oz > 0) return { ox, oy, oz, m };
    return null;
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Správanie dinosaurov: mäsožravce hliadkujú/naháňajú, spia po uspávači
function updateDinos(dt, now) {
    for (const d of dinos) {
        const g = d.group;
        const sleeping = now < d.sleepUntil;
        d.hit.sleeping = sleeping;
        d.zzz.visible = sleeping;
        if (sleeping) continue;

        const distXZ = Math.hypot(P.pos.x - g.position.x, P.pos.z - g.position.z);
        const near = distXZ < d.aggro && Math.abs(P.pos.y - d.baseY) < 3.5;
        let mx = 0, mz = 0;
        if (near) {
            const s = 3.2 * dt / Math.max(distXZ, 0.001);
            mx = (P.pos.x - g.position.x) * s;
            mz = (P.pos.z - g.position.z) * s;
        } else {
            d.phase += dt * d.speed;
            const tx = d.origin.x + (d.axis === 'x' ? Math.sin(d.phase) * d.range : 0);
            const tz = d.origin.z + (d.axis === 'z' ? Math.sin(d.phase) * d.range : 0);
            const f = Math.min(1, dt * 3);
            mx = (tx - g.position.x) * f;
            mz = (tz - g.position.z) * f;
        }
        g.position.x = clamp(g.position.x + mx, d.bounds.x1, d.bounds.x2);
        g.position.z = clamp(g.position.z + mz, d.bounds.z1, d.bounds.z2);
        const moving = Math.hypot(mx, mz) > 0.003;
        if (moving) {
            g.rotation.y = Math.atan2(mx, mz);
            d.walk += dt * (near ? 11 : 7);
            const swing = Math.sin(d.walk) * 0.55;
            d.group.userData.legL.rotation.x = swing;
            d.group.userData.legR.rotation.x = -swing;
            d.group.userData.armL.rotation.x = -swing * 0.5;
            d.group.userData.armR.rotation.x = swing * 0.5;
        }
    }
}

function physics(dt) {
    const nowMs = performance.now();
    // pohyblivé plošiny
    const t = nowMs / 1000;
    for (const mv of movers) {
        mv.prevPos.copy(mv.mesh.position);
        const offset = Math.sin(t * mv.speed + mv.phase) * mv.range;
        mv.mesh.position.copy(mv.origin);
        mv.mesh.position[mv.axis] += offset;
        mv.delta.subVectors(mv.mesh.position, mv.prevPos);
    }
    // ak hráč stojí na pohyblivej plošine (alebo triceratopsovi), nesie ho
    if (P.onGround && P.groundMover) P.pos.add(P.groundMover.delta);

    updateDinos(dt, nowMs);

    // smer pohybu podľa kamery
    let ix = 0, iz = 0;
    if (keys['KeyW'] || keys['ArrowUp']) iz -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) iz += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
    if (joy.active) { ix = joy.x; iz = joy.y; }
    const len = Math.hypot(ix, iz);
    if (len > 1) { ix /= len; iz /= len; }

    const sin = Math.sin(camYaw), cos = Math.cos(camYaw);
    const spd = moveSpeed();
    P.vel.x = (ix * cos - iz * sin) * spd;
    P.vel.z = (ix * sin + iz * cos) * spd;

    // skok: zo zeme aj podržaním; dvojskok (LV2+) len čerstvým stlačením
    const jumpPressed = keys['Space'] || jumpTouch;
    if (jumpPressed && P.onGround) {
        P.vel.y = jumpSpeed();
        P.onGround = false;
        P.groundMover = null;
        P.jumps = 1;
    } else if (jumpPressed && !P.prevJump && !P.onGround && P.jumps < maxJumps()) {
        P.vel.y = jumpSpeed() * 0.95;
        P.jumps++;
    }
    P.prevJump = jumpPressed;
    P.vel.y += GRAVITY * dt;

    // posun + kolízie po osiach
    P.onGround = false;
    P.groundMover = null;

    // Y
    P.pos.y += P.vel.y * dt;
    for (const pl of platforms) {
        const c = collideAABB(pl, P.pos);
        if (!c) continue;
        if (c.oy <= c.ox && c.oy <= c.oz) {
            const py = P.pos.y + P.height / 2 - P.feet;
            if (py > c.m.y) {
                P.pos.y += c.oy;
                if (P.vel.y < 0) {
                    P.onGround = true;
                    P.jumps = 0;
                    P.groundMover = movers.includes(pl) ? pl : null;
                }
                P.vel.y = Math.max(0, P.vel.y);
            } else {
                P.pos.y -= c.oy;
                P.vel.y = Math.min(0, P.vel.y);
            }
        }
    }
    // X
    P.pos.x += P.vel.x * dt;
    for (const pl of platforms) {
        const c = collideAABB(pl, P.pos);
        if (!c) continue;
        if (c.ox <= c.oy && c.ox <= c.oz) {
            P.pos.x += (P.pos.x > c.m.x ? c.ox : -c.ox);
        }
    }
    // Z
    P.pos.z += P.vel.z * dt;
    for (const pl of platforms) {
        const c = collideAABB(pl, P.pos);
        if (!c) continue;
        if (c.oz <= c.ox && c.oz <= c.oy) {
            P.pos.z += (P.pos.z > c.m.z ? c.oz : -c.oz);
        }
    }

    // močiar a mäsožravce (spiace neublížia; po smrti chvíľa nesmrteľnosti)
    if (nowMs >= P.invulnUntil) {
        for (const kb of killBricks) {
            if (kb.sleeping) continue;
            if (collideAABB(kb, P.pos)) {
                // dravec sa po úlovku vráti na začiatok hliadky
                if (kb.dino) {
                    kb.dino.group.position.set(kb.dino.origin.x, kb.dino.baseY, kb.dino.origin.z);
                    kb.dino.phase = 0;
                }
                die(kb.reason);
                return;
            }
        }
    }
    // pád do priepasti
    if (P.pos.y < -12) { die('fall'); return; }

    // bylinožravec: prvé pohladkanie dáva XP
    if (!trikePetted && collideAABB(trikeBox, P.pos, 0.3)) {
        trikePetted = true;
        addXP(10, '🦕 triceratops ťa má rád');
    }

    // checkpointy
    for (const cp of checkpoints) {
        if (collideAABB(cp, P.pos, 0.15) && !P.spawn.equals(cp.checkpoint)) {
            P.spawn.copy(cp.checkpoint);
            showMsg('✅ Checkpoint!', 1000);
            addXP(15, 'checkpoint');
        }
    }
    // vajcia
    for (const cn of coins) {
        if (cn.taken) continue;
        if (P.pos.distanceTo(cn.mesh.position) < 1.1) {
            cn.taken = true;
            cn.mesh.visible = false;
            coinCount++;
            $('coins').textContent = coinCount;
            addXP(25, 'dino vajce');
        }
    }
    // suroviny
    for (const pk of pickups) {
        if (pk.taken) continue;
        if (P.pos.distanceTo(pk.mesh.position) < 1.0) {
            pk.taken = true;
            pk.mesh.visible = false;
            save[pk.type]++;
            addXP(5, pk.type === 'wood' ? '🪵 drevo +1' : '🪨 kameň +1');
        }
    }
    // cieľ
    if (!finished && collideAABB(goal, P.pos, 0.15)) {
        finished = true;
        addXP(100, 'únik z parku');
        const secs = Math.floor((performance.now() - startTime) / 1000);
        showMsg(`🏆 UNIKOL SI Z PARKU!<br>Čas: ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')} • Vajcia: ${coinCount}/${coins.length}<br><small>Stlač R pre novú hru – postup a nástroje ti ostávajú</small>`, 0);
    }
}

// ---------- Animácia postavičky ----------
let walkPhase = 0;
function animatePlayer(dt) {
    player.position.copy(P.pos);
    player.position.y -= P.feet + 0.05;

    const speed = Math.hypot(P.vel.x, P.vel.z);
    if (speed > 0.5) {
        player.rotation.y = Math.atan2(P.vel.x, P.vel.z);
        walkPhase += dt * speed * 1.8;
        const swing = Math.sin(walkPhase) * 0.7;
        armL.rotation.x = swing; armR.rotation.x = -swing;
        legL.rotation.x = -swing; legR.rotation.x = swing;
    } else {
        armL.rotation.x *= 0.8; armR.rotation.x *= 0.8;
        legL.rotation.x *= 0.8; legR.rotation.x *= 0.8;
    }
    if (!P.onGround) {
        armL.rotation.x = armR.rotation.x = -2.6; // ruky hore pri skoku
    }
    // blikanie počas nesmrteľnosti po smrti
    const nowMs = performance.now();
    player.visible = nowMs >= P.invulnUntil || Math.floor(nowMs / 120) % 2 === 0;
}

// ---------- Slučka ----------
let lastT = performance.now();
function loop() {
    requestAnimationFrame(loop);
    const now = performance.now();
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;

    if (!finished && !shopOpen) physics(dt);
    animatePlayer(dt);

    // vajcia a suroviny sa vznášajú
    const t = now / 1000;
    for (const cn of coins) {
        if (cn.taken) continue;
        cn.mesh.rotation.y = t * 1.5;
        cn.mesh.position.y = cn.baseY + Math.sin(t * 2) * 0.15;
    }
    for (const pk of pickups) {
        if (pk.taken) continue;
        pk.mesh.rotation.y = t * 2;
        pk.mesh.position.y = pk.baseY + Math.sin(t * 2.4 + pk.mesh.position.x) * 0.1;
    }

    // triceratops sleduje svoj neviditeľný kolízny blok
    const tb = trikeBox.mesh.position;
    trikeGroup.position.set(tb.x, tb.y - 0.95, tb.z);
    trikeGroup.rotation.y = trikeBox.delta.x >= 0 ? Math.PI / 2 : -Math.PI / 2;

    // kamera
    const target = new THREE.Vector3().copy(P.pos).add(new THREE.Vector3(0, 1.6, 0));
    const camOff = new THREE.Vector3(
        Math.sin(camYaw) * Math.cos(camPitch),
        Math.sin(camPitch),
        Math.cos(camYaw) * Math.cos(camPitch)
    ).multiplyScalar(camDist);
    camera.position.copy(target).add(camOff);
    camera.lookAt(target);

    // slnko sleduje hráča (kvôli tieňom)
    sun.position.set(P.pos.x + 30, P.pos.y + 50, P.pos.z + 20);
    sun.target.position.copy(P.pos);
    sun.target.updateMatrixWorld();

    // časomiera + HUD
    if (!finished && !shopOpen) {
        const secs = Math.floor((now - startTime) / 1000);
        $('timer').textContent = `${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
    }
    updateHud();

    renderer.render(scene, camera);
}

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

// R po výhre = úplný reštart (postup ostáva uložený)
addEventListener('keydown', e => {
    if (e.code === 'KeyR' && finished) location.reload();
});

// diagnostika pre automatizované testy (bez vplyvu na hru)
window.__dbg = { P, coins, checkpoints, movers, pickups, dinos, save, trikeBox, tryStun, addXP, toggleShop };

showMsg('🦖 Jurský Obby<br><small>Uteč cez džungľu k bráne parku!<br>Zbieraj suroviny a vylepšuj nástroje v dielni (U).</small>', 3200);
respawn();
loop();
</script>
